<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAZI APPS Premium</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#090f21;color:#f6f8ff}header{padding:50px 5%;background:radial-gradient(circle at top right,#3646a9,#101b3d 55%,#090f21)}h1{font-size:clamp(35px,6vw,64px);margin:0}header p{color:#c4d0ed}main{max-width:1250px;margin:auto;padding:24px}input,select{background:#1b2745;color:white;border:1px solid #54618a;border-radius:12px;padding:12px;font:inherit}#search{width:min(100%,400px)}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:22px}.card{padding:24px;background:linear-gradient(150deg,#1d2a4b,#111a32);border:1px solid #354566;border-radius:20px;min-height:215px;display:flex;flex-direction:column}.icon{width:52px;height:52px;border-radius:15px;background:#4559a6;display:grid;place-items:center;font-weight:800;font-size:21px}.name{font-size:20px;font-weight:700;margin:16px 0 6px}.status{color:#b9c5df;font-size:13px;margin-bottom:15px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}a{color:#c7d6ff}.btn{background:#7d92ff;color:#09102b;text-decoration:none;font-weight:700;padding:10px 13px;border-radius:10px}.repo{padding:10px 0}.small{font-size:13px;color:#a8b7d5}footer{text-align:center;padding:35px;color:#b1bed9}</style></head><body><header><h1>LAZI <span style="color:#aab8ff">APPS</span></h1><p id="intro">Aplikacionet tona • Shkarkime dhe përditësime reale</p><select id="lang"><option value="sq">Shqip</option><option value="de">Deutsch</option><option value="en">English</option></select></header><main><input id="search" placeholder="Kërko aplikacion..."><p class="small" id="note">Shkarkimi shfaqet vetëm kur ekziston APK e publikuar në GitHub Releases.</p><section id="grid"></section></main><footer>LAZI APPS Premium · <span id="year"></span></footer><script>
const words={sq:{intro:"Aplikacionet tona • Shkarkime dhe përditësime reale",search:"Kërko aplikacion...",download:"Shkarko APK",repo:"GitHub",waiting:"Nuk ka APK të publikuar ende",loading:"Po kontrollohet versioni...",update:"Versioni",note:"Shkarkimi shfaqet vetëm kur ekziston APK e publikuar në GitHub Releases."},de:{intro:"Unsere Apps • Echte Downloads und Updates",search:"App suchen...",download:"APK herunterladen",repo:"GitHub",waiting:"Noch keine APK veröffentlicht",loading:"Version wird geprüft...",update:"Version",note:"Downloads erscheinen nur, wenn eine APK in GitHub Releases veröffentlicht ist."},en:{intro:"Our apps • Real downloads and updates",search:"Search apps...",download:"Download APK",repo:"GitHub",waiting:"No published APK yet",loading:"Checking version...",update:"Version",note:"Downloads appear only when an APK is published in GitHub Releases."}};
let apps=[],releases={},lang="sq";const el=id=>document.getElementById(id);function render(){const t=words[lang];document.documentElement.lang=lang;el("intro").textContent=t.intro;el("search").placeholder=t.search;el("note").textContent=t.note;const q=el("search").value.toLocaleLowerCase();el("grid").replaceChildren(...apps.filter(a=>a.name.toLocaleLowerCase().includes(q)).map(a=>{const c=document.createElement("article");c.className="card";const i=document.createElement("div");i.className="icon";i.textContent=a.name.replace(/[^a-zA-Z]/g,"").slice(0,2).toUpperCase();const n=document.createElement("div");n.className="name";n.textContent=a.name;const s=document.createElement("div");s.className="status";const x=releases[a.repo];s.textContent=x===undefined?t.loading:x&&x.apk?t.update+" "+x.version+(x.date?" · "+x.date:""):t.waiting;const b=document.createElement("div");b.className="actions";if(x&&x.apk){const dl=document.createElement("a");dl.className="btn";dl.href=x.apk;dl.textContent=t.download;b.append(dl)}const link=document.createElement("a");link.className="repo";link.href=a.repository_url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=t.repo+" ↗";b.append(link);c.append(i,n,s,b);if(x&&x.notes){const d=document.createElement("p");d.className="small";d.textContent=x.notes.slice(0,220);c.append(d)}return c}))}
async function check(a){try{const r=await fetch("https://api.github.com/repos/iljazsalihi95-wq/"+encodeURIComponent(a.repo)+"/releases/latest",{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw Error(r.status);const j=await r.json();const apk=(j.assets||[]).find(x=>x.name.toLowerCase().endsWith(".apk"));releases[a.repo]={apk:apk?.browser_download_url||null,version:j.tag_name||j.name||"",date:j.published_at?.slice(0,10)||"",notes:j.body||""}}catch(e){releases[a.repo]=null}render()}
el("lang").onchange=e=>{lang=e.target.value;render()};el("search").oninput=render;el("year").textContent=new Date().getFullYear();fetch("apps.json").then(r=>r.json()).then(data=>{apps=data;render();apps.forEach(check)}).catch(()=>{el("note").textContent="Could not load apps.json"});</script></body></html>
